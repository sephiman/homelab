[project]
name = "homelab-manage-tests"
version = "0.1.0"
description = "Tests for homelab-manage.sh, Hermes' only privileged entry point"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = ["tests"]
files = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "shellcheck-py>=0.11.0.1",
]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "fake_command", "fake_host"]
