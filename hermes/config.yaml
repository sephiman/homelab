# Installed as /etc/hermes/config.yaml, Hermes' managed config: every key here wins over
# ~hermes/.hermes/config.yaml and can't be changed by the agent or `hermes config set`. Edit it here,
# then `sudo ./install-host.sh && sudo systemctl restart hermes-gateway`.

# Any Hermes provider works; README "Choosing a model" lists options. Its key goes in LLM_API_KEY.
model:
  default: deepseek-v4.1-flash
  provider: opencode-go

terminal:
  backend: local
  cwd: /home/hermes/workspace
  timeout: 180

approvals:
  # manual: you approve every dangerous command from Telegram; `smart` would let an LLM approve.
  mode: manual
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  # Backstop only: the real limits are the user, sudoers and file permissions (see README).
  deny:
    - 'docker *'
    - 'docker-compose *'
    - 'podman *'
    - '*prune*'
    - 'rm -rf *'
    - 'rm -fr *'
    - 'iptables*'
    - 'ip6tables*'
    - 'nft *'
    - 'ufw *'
    - 'crontab *'
    - 'su *'
    - 'sudo -i*'
    - 'sudo -s*'
    - 'sudo su*'
    - '*.env*'
    - '*.pgpass*'

# Groq has no built-in Hermes provider; it's an OpenAI-compatible custom one (`custom:groq`).
providers:
  groq:
    api: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY

# Used when the primary fails (e.g. a Go usage window is spent). Its key goes in FALLBACK_API_KEY.
fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free

# A small model's background "self-improvement review" saved wrong conclusions about the wrapper
# as skills/memory that then overrode AGENTS.md. Hold every write for approval (`/memory pending`).
memory:
  write_approval: true
skills:
  write_approval: true

# Strangers get silence, not a pairing code.
unauthorized_dm_behavior: ignore

# Scheduled runs get no tools: their pre-run scripts (hermes/scripts/) collect the data, so a run
# nobody watches can't restart or update anything. A job can still opt in with enabled_toolsets.
platform_toolsets:
  cron: []
