# Seeded into /home/hermes/.hermes/config.yaml by install-host.sh only when none exists.
# After that, change the live copy (`sudo -iu hermes /home/hermes/.local/bin/hermes config set <key> <value>`) and
# mirror the change here.

# Any Hermes provider works; README "Choosing a model" lists options. Switch with `hermes model`
# (sets provider + endpoint together) and put that provider's key in hermes/.env.
model:
  default: nvidia/nemotron-3-ultra-550b-a55b:free
  provider: openrouter

terminal:
  backend: local
  cwd: /home/hermes/workspace
  timeout: 180

approvals:
  # manual: you approve every dangerous command from Telegram; `smart` would let an LLM approve.
  mode: manual
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  # Backstop only: the real limits are the user, sudoers and file permissions (see README).
  deny:
    - 'docker *'
    - 'docker-compose *'
    - 'podman *'
    - '*prune*'
    - 'rm -rf *'
    - 'rm -fr *'
    - 'iptables*'
    - 'ip6tables*'
    - 'nft *'
    - 'ufw *'
    - 'crontab *'
    - 'su *'
    - 'sudo -i*'
    - 'sudo -s*'
    - 'sudo su*'
    - '*.env*'
    - '*.pgpass*'

# Groq has no built-in Hermes provider; it's an OpenAI-compatible custom one (`custom:groq`).
providers:
  groq:
    api: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY

# Used when the primary fails (e.g. OpenRouter's per-account free-models-per-day limit, which no
# other OpenRouter :free model escapes). Its key goes in FALLBACK_API_KEY.
fallback_providers:
  - provider: custom:groq
    model: openai/gpt-oss-120b

# A small model's background "self-improvement review" saved wrong conclusions about the wrapper
# as skills/memory that then overrode AGENTS.md. Hold every write for approval (`/memory pending`).
memory:
  write_approval: true
skills:
  write_approval: true

# Strangers get silence, not a pairing code.
unauthorized_dm_behavior: ignore
