[project]
name = "agent-context"
version = "0.1.0"
description = "What Hermes' host tools share about the agent they run under: its home, model and Telegram chats"
requires-python = ">=3.13"
# Runtime is stdlib only: install-host.sh copies src/agent_context onto the host's python3, no venv.
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = ["src", "tests"]
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
