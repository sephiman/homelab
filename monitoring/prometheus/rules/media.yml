groups:
  - name: media
    rules:
      - alert: ArrHealthIssue
        # Same list as each app's System → Status page (download client unreachable, import failing, ...).
        expr: sum by (instance) ({__name__=~"(sonarr|radarr)_system_health_issues"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} reports {{ $value }} health issue(s)"
          description: "Open the app's System → Status page for details."

      - alert: ProwlarrHealthIssue
        # Longer window: indexer/proxy failures (e.g. FlareSolverr timeouts) often recover on their own.
        expr: sum by (instance) (prowlarr_system_health_issues) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} reports {{ $value }} health issue(s)"
          description: "Open Prowlarr's System → Status page for details (failing indexers or proxies)."

      - alert: ArrExporterDown
        expr: up{instance=~"exportarr-.*"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is down or can't reach its app"
          description: "Check the container logs and that the API key in media/.env is set."
