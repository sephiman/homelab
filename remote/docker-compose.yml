services:
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs -r ${RUSTDESK_RELAY_HOST}:${RUSTDESK_RELAY_PORT}
    volumes:
      - ${HOME}/rustdesk/hbbs:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    restart: unless-stopped
    networks:
      - my-network

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    volumes:
      - ${HOME}/rustdesk/hbbr:/root
    ports:
      - "21117:21117"
    restart: unless-stopped
    networks:
      - my-network

networks:
  my-network:
    external: true
    name: all_dockers
