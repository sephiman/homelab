[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "Vendor-agnostic 3-tier coding agent orchestrating Claude Code, Gemini CLI, and OpenCode"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
coding-agent = "src.cli:main"
